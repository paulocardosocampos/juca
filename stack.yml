# ---------------------------------------------------------------------------
# Stack do Docker Swarm — site Juca Carros Velhos
# Cole este conteúdo no Portainer: Stacks → Add stack → Web editor
#
# ANTES DE IMPLANTAR, confira/ajuste os 3 pontos marcados com "AJUSTE":
#   1. o nome da rede overlay do Traefik (aparece 2x: em "networks" e na label
#      traefik.docker.network);
#   2. o nome do entrypoint HTTPS e do certresolver do seu Traefik;
#   3. as variáveis AUTH_SECRET e ADMIN_PASSWORD.
#
# Para descobrir 1 e 2, rode na VPS:
#   docker service inspect $(docker service ls --filter name=traefik -q) \
#     --format '{{json .Spec.TaskTemplate.Networks}}{{"\n"}}{{json .Spec.TaskTemplate.ContainerSpec.Args}}'
# ---------------------------------------------------------------------------
version: "3.8"

services:
  juca:
    image: ghcr.io/paulocardosocampos/juca:latest

    environment:
      # Banco SQLite dentro do volume juca_data
      DATABASE_URL: "file:/data/juca.db"

      # AJUSTE 3 — segredo da sessão. Gere um com: openssl rand -base64 33
      AUTH_SECRET: "COLE_AQUI_UM_SEGREDO_LONGO_E_ALEATORIO"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://juca.pcmidialabs.com.br"

      # Administrador criado na primeira subida. Trocar a senha aqui e
      # reimplantar a stack redefine a senha do usuário.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "COLE_AQUI_UMA_SENHA_FORTE"
      ADMIN_NAME: "Juca"

      TZ: "America/Sao_Paulo"

    volumes:
      - juca_data:/data                    # banco de dados
      - juca_uploads:/app/public/uploads   # fotos enviadas pelo admin

    networks:
      - network_public                     # AJUSTE 1 — rede do Traefik

    deploy:
      mode: replicated
      replicas: 1        # o SQLite exige exatamente 1 réplica
      placement:
        constraints:
          - node.role == manager   # mantém o volume sempre no mesmo nó
      update_config:
        order: stop-first          # nunca dois containers no mesmo banco
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "1"
          memory: 700M
        reservations:
          memory: 200M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public          # AJUSTE 1
        - traefik.http.routers.juca.rule=Host(`juca.pcmidialabs.com.br`)
        - traefik.http.routers.juca.entrypoints=websecure # AJUSTE 2
        - traefik.http.routers.juca.tls=true
        - traefik.http.routers.juca.tls.certresolver=letsencryptresolver # AJUSTE 2
        - traefik.http.routers.juca.service=juca
        - traefik.http.services.juca.loadbalancer.server.port=3000
        - traefik.http.services.juca.loadbalancer.passHostHeader=true

volumes:
  juca_data:
  juca_uploads:

networks:
  network_public:      # AJUSTE 1 — precisa ser a rede overlay já usada pelo Traefik
    external: true
