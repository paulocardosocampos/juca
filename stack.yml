# ---------------------------------------------------------------------------
# Stack do Docker Swarm — site Juca Carros Velhos
# Portainer → Stacks → Add stack → Web editor → colar este conteúdo.
#
# Valores já conferidos no ambiente (Traefik 2.11.2):
#   rede overlay ....... network_public
#   entrypoint HTTPS ... websecure  (o entrypoint web já redireciona :80 → :443)
#   certresolver ....... letsencryptresolver  (desafio HTTP-01)
#
# Só falta preencher AUTH_SECRET e ADMIN_PASSWORD, marcados com "PREENCHER".
# ---------------------------------------------------------------------------
version: "3.8"

services:
  juca:
    image: ghcr.io/paulocardosocampos/juca:latest

    environment:
      # Banco SQLite dentro do volume juca_data
      DATABASE_URL: "file:/data/juca.db"

      # PREENCHER — gere na VPS com: openssl rand -base64 33
      AUTH_SECRET: "COLE_AQUI_O_SEGREDO_GERADO"
      AUTH_TRUST_HOST: "true"
      # Precisa ser o domínio público, senão o login redireciona para o
      # endereço interno do container.
      AUTH_URL: "https://juca.pcmidialabs.com.br"

      # Administrador criado na primeira subida. Trocar a senha aqui e
      # reimplantar a stack redefine a senha do usuário.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "PREENCHER_COM_UMA_SENHA_FORTE"
      ADMIN_NAME: "Juca"

      TZ: "America/Sao_Paulo"

    volumes:
      - juca_data:/data                    # banco de dados
      - juca_uploads:/app/public/uploads   # fotos enviadas pelo admin

    networks:
      - network_public

    deploy:
      mode: replicated
      replicas: 1        # o SQLite exige exatamente 1 réplica
      placement:
        constraints:
          # Prende o serviço ao nó que tem os volumes. Se o swarm tiver mais de
          # um manager, troque por: node.hostname == manager1
          - node.role == manager
      update_config:
        order: stop-first          # nunca dois containers no mesmo banco
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "1"
          memory: 700M
        reservations:
          memory: 200M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.juca.rule=Host(`juca.pcmidialabs.com.br`)
        - traefik.http.routers.juca.entrypoints=websecure
        - traefik.http.routers.juca.tls=true
        - traefik.http.routers.juca.tls.certresolver=letsencryptresolver
        - traefik.http.routers.juca.service=juca
        - traefik.http.services.juca.loadbalancer.server.port=3000
        - traefik.http.services.juca.loadbalancer.passHostHeader=true

volumes:
  juca_data:
  juca_uploads:

networks:
  network_public:
    external: true
